[package]
name = "jupiter-amm-test-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Self-verification harness for Jupiter AMM integrations: load a pool snapshot, run the SDK quote, execute the AMM's native swap in LiteSVM, and assert the on-chain token delta matches the quote."
repository = "https://github.com/jup-ag/jupiter-amm-interface/"

[dependencies]
jupiter-amm-interface = { path = "../interface" }
litesvm = "0.14.0"
solana-account = "4"
solana-pubkey = "4"
solana-instruction = "3"
solana-clock = "3.1.1"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
solana-compute-budget-interface = "3"
bincode = "1.3"
serde_json = "1" # for KeyedAccount.params

# Optional RPC snapshotter (default on). A minimal JSON-RPC getMultipleAccounts client, so
# the kit can produce fixtures from a live pool — no heavy solana-client dependency tree.
ureq = { version = "2", features = ["json"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["rpc"]
rpc = ["dep:ureq", "dep:base64"]
